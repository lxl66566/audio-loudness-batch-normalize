[package]
name        = "audio-loudness-batch-normalize"
version     = "0.3.3"
edition     = "2024"
description = "Easy to use audio loudness batch normalization tool using EBU R128 and RMS"
readme      = "README.md"
repository  = "https://github.com/lxl66566/audio-loudness-batch-normalize"
license     = "MIT"
keywords    = ["audio", "batch-processing", "loudness", "multimedia", "normalization"]
categories  = ["multimedia::audio"]
include     = ["/LICENSE", "/README.md", "/src/**", "/tests/**"]

[[bin]]
name              = "loudness-normalize"
path              = "src/main.rs"
required-features = ["bin"]

[dependencies]
anyhow       = { version = "1.0", optional = true }
clap         = { version = "4.6", features = ["derive"], optional = true }
ebur128      = "0.1"
env_filter   = { version = "0.1", optional = true }
hound        = "3.5"
indicatif    = { version = "0.18", features = ["rayon"] }
log          = "0.4"
pathdiff     = "0.2"
rand         = "0.10"
rayon        = "1.12"
spdlog-rs    = { version = "0.5", features = ["flexible-string", "log"], optional = true }
strum        = "0.28"
strum_macros = "0.28"
symphonia    = { version = "0.6", features = ["all-codecs", "all-formats"] }
tempfile     = "3"
thiserror    = "2.0"
vorbis_rs    = "0.5"
walkdir      = "2"

[features]
bin  = ["anyhow", "clap", "env_filter", "spdlog-rs"]
simd = ["symphonia/opt-simd"]

[lints.clippy]
all                     = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
doc_markdown            = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
pedantic                = { level = "warn", priority = -1 }
wildcard_imports        = "allow"

[lints.rust]
unsafe_code           = "allow"
unused_qualifications = "warn"

[profile.release]
opt-level     = 3
strip         = true
lto           = true
panic         = "abort"
codegen-units = 1
